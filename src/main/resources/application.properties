spring.application.name=api-productos

# ===== Reto 3: MySQL en vez de H2 =====
# la BD se crea sola si no existe (createDatabaseIfNotExist)
# usuario root sin clave como en XAMPP, cambiarlo si tu MySQL tiene clave
spring.datasource.url=jdbc:mysql://localhost:3306/inventariodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ===== Config original con H2 (taller) =====
# quedo en application-h2.properties
# para usarla correr con el perfil h2: -Dspring-boot.run.profiles=h2
